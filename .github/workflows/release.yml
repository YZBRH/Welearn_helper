name: Release Windows EXE

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirement.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Build Windows executable
        run: powershell -ExecutionPolicy Bypass -File scripts/build_exe.ps1

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 dist\WelearnHelper.exe).Hash
          "$hash  WelearnHelper.exe" | Out-File -Encoding ascii dist\WelearnHelper.exe.sha256

      - name: Upload GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/WelearnHelper.exe
            dist/WelearnHelper.exe.sha256
